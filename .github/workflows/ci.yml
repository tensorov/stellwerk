name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      # ── GATE: строгие шаги, падение блокирует мерж ──────────────────────
      - name: fmt (gate)
        run: cargo fmt --all -- --check

      # Работает и на todo!()/unimplemented!(): задумка clippy — ловить
      # предупреждения, а не падения. Сломанный предикат это не ломает.
      - name: clippy (gate)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test registry (gate)
        run: cargo test -p stellwerk-registry --locked --no-fail-fast

      # ── INFORMATIONAL: core/store содержат RED-спецификацию ────────────
      # Падение ожидаемо: это записанная падающими тестами будущая работа
      # (см. .sisyphus/plans/M1 и docs/PIVOT.md). continue-on-error не даёт
      # красному CI скрывать настоящие регрессии, но и не блокирует мерж
      # зелёного кода, пока спецификация не превращена в GREEN пакетами M1.
      - name: test core (informational)
        continue-on-error: true
        run: cargo test -p stellwerk-core --locked --no-fail-fast

      - name: test store (informational)
        continue-on-error: true
        run: cargo test -p stellwerk-store --locked --no-fail-fast

      # Сводка по спецификации: видно в логе, сколько RED осталось.
      - name: spec status (informational)
        if: always()
        run: |
          for c in stellwerk-core stellwerk-store; do
            counts=$(cargo test -p "$c" --no-fail-fast 2>&1 \
              | grep -E "^test result:" \
              | awk -F'[ ;.]+' '{p+=$4; f+=$6} END {print p+0, f+0}' || true)
            set -- $counts
            echo "$c: $1/$(( $1 + $2 )) ($2 RED, expected — architecture spec)"
          done

      - run: ./scripts/plan-lint.sh || true   # информативно
