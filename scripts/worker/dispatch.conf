# Конфиг воркер-слоя stellwerk-dispatch.
# Все значения — дефолты через ${VAR:=...}: переменная окружения ИМЕЕТ приоритет.
# Файл: $STELLWERK_WORKER_CONF (по умолчанию scripts/worker/dispatch.conf).

# --- LOOP_GUARD -----------------------------------------------------------------
# SIGTERM воркеру при N+1 идентичных tool-вызовах ПОДРЯД (tool + нормализованные args).
# Происхождение: SoL-Pi ablation, packet-07a — 104 идентичных grep подряд из 166 шагов.
# В F-2026-09-26-01 рекомендован порог 20 (безопасный запас).
LOOP_CONSEC_LIMIT=${LOOP_CONSEC_LIMIT:-20}
# Порог по СУММЕ за прогон; 0 = выключено (ловим только явное повторение подряд).
LOOP_TOTAL_LIMIT=${LOOP_TOTAL_LIMIT:-0}
# Бюджет прогона. Происхождение: сессия #2, 3 из 10 прогонов M1 ушли в повтор
# на 38–43 tool_steps и 480–790k input при окне модели 46112 (~17 полных
# контекстов подряд). Consec-guard их не ловил: вызовы были РАЗНЫМИ, повтор
# был не в отдельном вызове, а в длине прогона.
# Калибровка по РЕАЛЬНЫМ трассам. Метрики пересчитаны прямо из трасс формулой
# validity_gate (input + cacheRead + cacheWrite по turn_end), НЕ взяты из отчётов.
# Подробный разбор: scripts/worker/tests/traces/MANIFEST.md
#
#   ИТОГ    input  cacheRead  пакет   вердикт
#    36 459   13 403    23 056  M2-01   легитимно (stop)
#   328 068   49 300   278 768  M2-03   легитимно (accept.sh: ПРИНЯТО)
#   530 124   75 292   454 832  M2-02   НЕ runaway: нечитаемая фикстура
#   591 569   69 665   521 904  M2-02   НЕ runaway: нечитаемая фикстура
#   655 622  135 814   519 808  M2-03   ЛЕГИТИМЕН (canary, stop=stop)
#
# ВНИМАНИЕ, ИЗВЕСТНОЕ ПРОТИВОРЕЧИЕ. Раньше здесь стояло обоснование «зазор между
# классами 202056, порог 400000 внутри него». Оно ОПРОВЕРГНУТО теми же
# трассами:
#   * 400000 отвергает ЛЕГИТИМНЫЙ прогон canary (655622) — accept.sh дал ПРИНЯТО;
#   * cacheRead у «зависших» трасс (521904, 454832) и у легитимной canary
#     (519808) совпадает в пределах 1% — порог не различает их в принципе;
#   * cacheRead — ~80% метрики: input_cum мерит, сколько раз агент перечитал
#     свой растущий контекст, то есть длину разговора, а не объём работы;
#   * разброс одной и той же работы — 2x (328068 и 655622 для M2-03).
# От застревания реально защищают wall-clock таймаут, guard на одинаковые
# вызовы подряд и гейты качества (accept.sh, postflight), а не счётчик токенов.
# Значение 400000 оставлено как задано владельцем; решение за ним.
MAX_TOOL_STEPS=${MAX_TOOL_STEPS:-60}      # АВАРИЙНЫЙ предел, не основной детектор
# MAX_INPUT_CUM ВЫВЕДЕН ИЗ УСЛОВИЙ УБИЙСТВА (решение владельца). 0 = счётчик
# остаётся метрикой в отчёте, но никогда не убивает прогон.
#
# Основание — собственные трассы, scripts/worker/tests/traces/MANIFEST.md:
#   ИТОГ    input  cacheRead  пакет   вердикт
#    36 459   13 403    23 056  M2-01   легитимно
#   328 068   49 300   278 768  M2-03   легитимно
#   530 124   75 292   454 832  M2-02   НЕ runaway: нечитаемая фикстура
#   591 569   69 665   521 904  M2-02   НЕ runaway: нечитаемая фикстура
#   655 622  135 814   519 808  M2-03   легитимно (canary, stop=stop)
#
#   * cacheRead — ~80% метрики: счётчик мерит, сколько раз агент перечитал
#     свой растущий контекст, то есть длину разговора, а не объём работы;
#   * у «зависших» трасс чтение кэша 521904/454832 против 519808 у легитимной
#     canary — разница <1%, порог не различает классы в принципе;
#   * настоящего runaway в выборке нет: M2-02 зависал на нечитаемой фикстуре
#     (F-2026-09-27-01), исправленной;
#   * разброс одной и той же работы 2x (328068 против 655622 у M2-03);
#   * порог 400000 резал ЛЕГИТИМНУЮ работу (canary, accept.sh: ПРИНЯТО).
#
# За застревание отвечают: MAX_TOOL_STEPS, LOOP_CONSEC_LIMIT (настоящие циклы),
# wall-clock таймаут STELLWERK_PACKET_TIMEOUT и гейты качества accept.sh +
# postflight — они и ловили реальные дефекты, тогда как бюджет резал работы.
#
# ВЕРНУТЬ СЧЁТЧИК В УСЛОВИЯ УБИЙСТВА можно только явным MAX_INPUT_CUM=N.
MAX_INPUT_CUM=${MAX_INPUT_CUM:-0}
# Пауза до SIGKILL после SIGTERM, сек.
LOOP_KILL_AFTER=${LOOP_KILL_AFTER:-10}
# Опрос JSONL сторожем, сек.
LOOP_POLL_INTERVAL=${LOOP_POLL_INTERVAL:-1.5}

# --- VALIDITY GATE --------------------------------------------------------------
# exit 0 от pi НЕ является успехом. invalid → packet возвращается, не мержится.
GATE_REQUIRE_STOP_OK=${GATE_REQUIRE_STOP_OK:-1}   # stop_reason_last == "error"
GATE_REQUIRE_TOOL_STEPS=${GATE_REQUIRE_TOOL_STEPS:-1}  # tool_steps == 0
GATE_REQUIRE_TURNS=${GATE_REQUIRE_TURNS:-1}       # turns < 2
POSTFLIGHT_FMT=${POSTFLIGHT_FMT:-1}      # cargo fmt --all в песочнице перед экспортом
POSTFLIGHT_CLIPPY=${POSTFLIGHT_CLIPPY:-1} # clippy -D warnings; ошибка = экспорт запрещён
# timeout == true && turns < 2 → invalid (умер до первого содержательного хода)

# --- PEAK GUARD -------------------------------------------------------------------
# peak = максимум по событиям message_end величины input + cacheRead + cacheWrite
# (определение: F-2026-09-29-21, .stellwerk/FINDINGS.md).
#
# Порог калиброван прогоном M5-07c (qwen3.6-unlim-xl-noreason, pi exit=0, valid;
# запись измерения: F-2026-10-06-81, .stellwerk/FINDINGS.md):
#   overhead пустой сессии 6157; max_output НАБЛЮДАЕМЫЙ 365; peak_context 22462
#   (ход 9); ходов 10; tool_steps 13; wall 74s.
# 365 — то, что излил ОДИН пакет, а не потолок модели: в формуле guard'а вычитается
# ПОТОЛОК ВЫВОДА, иначе порог встаёт на 6871 токена выше верного (F-81).
#
# Обе формулы от потолка 138336 (решение владельца 2026-10-06, каталог `pi` устарел):
#   138336 - 8000 - 13033 = 117303   ← верна: минус потолок вывода, минус резерв
#   138336 - 365 - 13797 = 124174    ← НЕВЕРНА для guard: минус наблюдаемый вывод
#
# ОГОВОРКА — это НЕ измеренный факт, а открытый вопрос владельцу: XL нет в каталоге
# `pi` (`pi --list-models xl` -> No models matching xl), ~/.pi/agent/models.json знает
# только её соседей с contextWindow 46112. Если настоящий потолок 46112, guard 117303
# выше него более чем вдвое и НЕ СРАБОТАЕТ НИКОГДА. Потолок 138336 взят из формулы
# владельца, прогоном не подтверждён (максимум хода 22462 < 46112) и требует либо
# пробника на длинном входе, либо подтверждения от провайдера.
#
# 0 = проверка выключена, счётчик остаётся метрикой в отчёте. Это НЕ равнозначно
# «peak в норме»: отсутствие замера — отдельное состояние, а не разрешение.
MAX_PEAK_CONTEXT=${MAX_PEAK_CONTEXT:-$((138336 - 8000 - 13033))}

# Ограничение на значение, когда ключ включён (уточнение владельца 1c, 2026-10-05):
#
#   MAX_PEAK_CONTEXT < (потолок модели) − (фактический max_output)
#
# При потолке 138 336 ориентир ~125 000, но принимается только по замеру max_output
# пробником (раздел 1b плана .omo/plans/M5-mutation-gate-and-runtime.md). Значение у
# самого потолка бессмысленно: провайдер урежет раньше guard'а, обрыв будет выглядеть
# как корректная остановка, а не как runaway.
#
# Независимо от MAX_PEAK_CONTEXT: MAX_INPUT_CUM остаётся выведенным из условий убийства
# (решение владельца). Возврат счётчика токенов в убийство через новый ключ запрещён.

# --- SANDBOX --------------------------------------------------------------------
SANDBOX_ROOT=${SANDBOX_ROOT:-/tmp/stellwerk-sandbox}
SANDBOX_KEEP=${SANDBOX_KEEP:-0}          # 1 = не удалять песочницу после прогона
PATH_GUARD_STRICT=${PATH_GUARD_STRICT:-1} # 1 = абсолютный путь репо в packet запрещён (F1-вектор)
