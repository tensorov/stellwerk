[package]
name = "stellwerk-task"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
stellwerk-core  = { path = "../stellwerk-core" }
stellwerk-store = { path = "../stellwerk-store" }
# F-10: без этой строки decide() из gateway недостижим из раннера — крейт
# task не видел слой разрешений вовсе.
stellwerk-gateway = { path = "../stellwerk-gateway" }
serde           = { workspace = true }
serde_json      = { workspace = true }
sha2            = { workspace = true }
toml            = { workspace = true }
thiserror       = { workspace = true }
clap            = { workspace = true }
tokio           = { workspace = true }
# N1-08: цепочка доказательств живёт в отдельной таблице SQLite. Крейт уже есть
# в [workspace.dependencies] и подключён в stellwerk-store; здесь — только строка,
# новая внешняя зависимость не появляется.
rusqlite        = { workspace = true }
# N2-00g1: TLS для хостового backend. Клиент наш (TokenProxy::send), из внешнего
# берётся только TLS-слой; см. docs/adr/0020-http-transport.md.
rustls          = { workspace = true }
webpki-roots    = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
