[workspace]
resolver = "2"
members  = ["crates/stellwerk-core", "crates/stellwerk-registry"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"   # поднять, если rmcp потребует выше

[workspace.dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml       = "1.1.6"
anyhow     = "1.0.104"
thiserror  = "2.0.20"
tokio      = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
tracing    = "0.1.44"
sha2       = "0.10.9"
rmcp       = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process"] }  # ⚠️verify features

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
