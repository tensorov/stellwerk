name: ci
on: { push: { branches: [main] }, pull_request: {} }

# Tier-1 strict gate: mirrors `just check`. Every job below is required — a
# failure in any job fails the workflow. The RED spec suite is a separate
# workflow (task 19) and is intentionally absent here. Required checks are
# configured in branch protection, not in this file (ADR-0027).
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: "rustfmt, clippy" }
      - run: cargo clippy --workspace --all-targets -- -D warnings

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test -p stellwerk-registry --locked

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test -p stellwerk-core --locked

  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test -p stellwerk-store --locked

  risk-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test -p xtask --test ledger_encoding

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: extractions/setup-just@v2
      - run: just scripts

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test -p stellwerk-registry --test repo_hygiene

  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: bash scripts/scan-history.sh

  plan-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: ./scripts/plan-lint.sh
