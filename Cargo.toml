[workspace]
resolver = "2"
members  = ["crates/stellwerk-core", "crates/stellwerk-registry", "crates/stellwerk-store"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"   # поднять, если rmcp потребует выше

[workspace.dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml       = "1.1.6"
anyhow     = "1.0.104"
thiserror  = "2.0.20"
tokio      = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
tracing    = "0.1.44"
sha2       = "0.10.9"
# ⚠️ contract-change (ночная сессия, фаза 4): единственное добавление зависимости
# за эту сессию. SQLite — локальное хранилище федерации; later = Postgres.
rusqlite   = { version = "0.33", features = ["bundled"] }
rmcp       = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process"] }  # ⚠️verify features

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# manual_async_fn — ЛОЖНОЕ срабатывание в stellwerk-store, отключено намеренно.
#
# Линт предлагает заменить `fn .. -> impl Future<Output=..> + Send` на `async fn`.
# Замена НЕ эквивалентна: `async fn` в публичном трейте не позволяет задать
# auto-trait bounds, о чём rustc и предупреждает сам
# ("use of `async fn` in public traits is discouraged as auto trait bounds
# cannot be specified"). При `-D warnings` это становится ошибкой, то есть
# оба варианта одновременно не проходят gate.
#
# Send-гарантия здесь не стилистика, а требование: crates/stellwerk-store/tests/
# concurrent.rs использует `tokio::spawn` (требует Future: Send) для проверки
# конкурентной записи 10 писателей. Согласившись на предложение линта, мы
# потеряли бы Send молча и тест перестал бы проверять то, ради чего написан.
#
# Альтернативы рассмотрены и отвергнуты:
#   * async-trait (крейт)   — запрещено: новая зависимость;
#   * синхронные трейты     — rusqlite синхронен by design, но 21 RED-тест
#                             написан с `.await`; переписывание тестов означало
#                             бы смену приказа, а не его исполнение;
#   * #[allow(..)] в коде   — прямо запрещено AGENTS.md.
# Это политика уровня проекта (Cargo.toml), а не атрибут в коде.
manual_async_fn = "allow"
