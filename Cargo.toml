[workspace]
resolver = "2"
members  = ["crates/stellwerk-core", "crates/stellwerk-registry", "crates/stellwerk-store", "crates/stellwerk-task"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"   # поднять, если rmcp потребует выше

[workspace.dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml       = "1.1.6"
anyhow     = "1.0.104"
thiserror  = "2.0.20"
tokio      = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
tracing    = "0.1.44"
sha2       = "0.10.9"
# ⚠️ contract-change (ночная сессия, фаза 4): единственное добавление зависимости
# за эту сессию. SQLite — локальное хранилище федерации; later = Postgres.
rusqlite   = { version = "0.33", features = ["bundled"] }
rmcp       = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process"] }  # ⚠️verify features

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
# Исключения lint-политики живут в крейтах, а не здесь: workspace-lints
# применяются ко всем крейтам сразу и не могут нести обоснование,
# относящееся к одному крейту. См. docs/adr/0001-manual-async-fn.md.
