# Алиас `cargo xtask` — конвенция rust-lang/xtask. Без него cargo ищет
# внешний бинарник `cargo-xtask` в PATH и не находит его, потому что наш крейт
# живёт в workspace, а не устанавливается.
#
# Обрати внимание: cargo передаёт xtask всё, что стоит после `xtask`. Защита от
# подстановки команды держится НЕ здесь, а в самом xtask: имя задачи — литерал
# в match, путь — константа, лишние аргументы игнорируются.
[alias]
xtask = "run --package xtask --"
