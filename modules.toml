[registry]
context_budget_tokens  = 44000
autoload_budget_tokens = 3000
lazy_budget_tokens     = 5000

# Коэффициенты байты->токены для qwen 35b a3b. Замерить один раз руками:
# пустая сессия без PolyForge vs с PolyForge, разницу поделить на байты схем.
[registry.calibration]
bytes_per_token = 0.0   # PIN_ME после ручного замера
measured_at     = ""    # ISO8601

[module.polyforge]
kind     = "mcp"
autoload = true
risk     = "R3"
source   = { git = "https://github.com/tensorov/polyforge", rev = "71c295c6f29546743a2c1fe43a64a04a07c9516c" }
command  = "polyforge-mcp"
tools    = ["evidence_append", "evidence_verify", "gate_evaluate", "gate_report"]
context_cost_tokens = 0
# заполнит `stellwerk module measure`
update   = { channel = "tag", policy = "pr" }
