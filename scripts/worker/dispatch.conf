# Конфиг воркер-слоя stellwerk-dispatch.
# Все значения — дефолты через ${VAR:=...}: переменная окружения ИМЕЕТ приоритет.
# Файл: $STELLWERK_WORKER_CONF (по умолчанию scripts/worker/dispatch.conf).

# --- LOOP_GUARD -----------------------------------------------------------------
# SIGTERM воркеру при N+1 идентичных tool-вызовах ПОДРЯД (tool + нормализованные args).
# Происхождение: SoL-Pi ablation, packet-07a — 104 идентичных grep подряд из 166 шагов.
# В F-2026-09-26-01 рекомендован порог 20 (безопасный запас).
LOOP_CONSEC_LIMIT=${LOOP_CONSEC_LIMIT:-20}
# Порог по СУММЕ за прогон; 0 = выключено (ловим только явное повторение подряд).
LOOP_TOTAL_LIMIT=${LOOP_TOTAL_LIMIT:-0}
# Пауза до SIGKILL после SIGTERM, сек.
LOOP_KILL_AFTER=${LOOP_KILL_AFTER:-10}
# Опрос JSONL сторожем, сек.
LOOP_POLL_INTERVAL=${LOOP_POLL_INTERVAL:-1.5}

# --- VALIDITY GATE --------------------------------------------------------------
# exit 0 от pi НЕ является успехом. invalid → packet возвращается, не мержится.
GATE_REQUIRE_STOP_OK=${GATE_REQUIRE_STOP_OK:-1}   # stop_reason_last == "error"
GATE_REQUIRE_TOOL_STEPS=${GATE_REQUIRE_TOOL_STEPS:-1}  # tool_steps == 0
GATE_REQUIRE_TURNS=${GATE_REQUIRE_TURNS:-1}       # turns < 2
# timeout == true && turns < 2 → invalid (умер до первого содержательного хода)

# --- SANDBOX --------------------------------------------------------------------
SANDBOX_ROOT=${SANDBOX_ROOT:-/tmp/stellwerk-sandbox}
SANDBOX_KEEP=${SANDBOX_KEEP:-0}          # 1 = не удалять песочницу после прогона
PATH_GUARD_STRICT=${PATH_GUARD_STRICT:-1} # 1 = абсолютный путь репо в packet запрещён (F1-вектор)
