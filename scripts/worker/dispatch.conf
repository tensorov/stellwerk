# Конфиг воркер-слоя stellwerk-dispatch.
# Все значения — дефолты через ${VAR:=...}: переменная окружения ИМЕЕТ приоритет.
# Файл: $STELLWERK_WORKER_CONF (по умолчанию scripts/worker/dispatch.conf).

# --- LOOP_GUARD -----------------------------------------------------------------
# SIGTERM воркеру при N+1 идентичных tool-вызовах ПОДРЯД (tool + нормализованные args).
# Происхождение: SoL-Pi ablation, packet-07a — 104 идентичных grep подряд из 166 шагов.
# В F-2026-09-26-01 рекомендован порог 20 (безопасный запас).
LOOP_CONSEC_LIMIT=${LOOP_CONSEC_LIMIT:-20}
# Порог по СУММЕ за прогон; 0 = выключено (ловим только явное повторение подряд).
LOOP_TOTAL_LIMIT=${LOOP_TOTAL_LIMIT:-0}
# Бюджет прогона. Происхождение: сессия #2, 3 из 10 прогонов M1 ушли в повтор
# на 38–43 tool_steps и 480–790k input при окне модели 46112 (~17 полных
# контекстов подряд). Consec-guard их не ловил: вызовы были РАЗНЫМИ, повтор
# был не в отдельном вызове, а в длине прогона.
# Калибровка по РЕАЛЬНЫМ трассам. Метрики пересчитаны прямо из трасс формулой
# validity_gate (input + cacheRead + cacheWrite по turn_end), НЕ взяты из отчётов.
# Подробный разбор: scripts/worker/tests/traces/MANIFEST.md
#
#   ИТОГ    input  cacheRead  пакет   вердикт
#    36 459   13 403    23 056  M2-01   легитимно (stop)
#   328 068   49 300   278 768  M2-03   легитимно (accept.sh: ПРИНЯТО)
#   530 124   75 292   454 832  M2-02   НЕ runaway: нечитаемая фикстура
#   591 569   69 665   521 904  M2-02   НЕ runaway: нечитаемая фикстура
#   655 622  135 814   519 808  M2-03   ЛЕГИТИМЕН (canary, stop=stop)
#
# ВНИМАНИЕ, ИЗВЕСТНОЕ ПРОТИВОРЕЧИЕ. Раньше здесь стояло обоснование «зазор между
# классами 202056, порог 400000 внутри него». Оно ОПРОВЕРГНУТО теми же
# трассами:
#   * 400000 отвергает ЛЕГИТИМНЫЙ прогон canary (655622) — accept.sh дал ПРИНЯТО;
#   * cacheRead у «зависших» трасс (521904, 454832) и у легитимной canary
#     (519808) совпадает в пределах 1% — порог не различает их в принципе;
#   * cacheRead — ~80% метрики: input_cum мерит, сколько раз агент перечитал
#     свой растущий контекст, то есть длину разговора, а не объём работы;
#   * разброс одной и той же работы — 2x (328068 и 655622 для M2-03).
# От застревания реально защищают wall-clock таймаут, guard на одинаковые
# вызовы подряд и гейты качества (accept.sh, postflight), а не счётчик токенов.
# Значение 400000 оставлено как задано владельцем; решение за ним.
MAX_TOOL_STEPS=${MAX_TOOL_STEPS:-60}      # АВАРИЙНЫЙ предел, не основной детектор
MAX_INPUT_CUM=${MAX_INPUT_CUM:-400000}    # ОСНОВНОЙ детектор runaway
# Пауза до SIGKILL после SIGTERM, сек.
LOOP_KILL_AFTER=${LOOP_KILL_AFTER:-10}
# Опрос JSONL сторожем, сек.
LOOP_POLL_INTERVAL=${LOOP_POLL_INTERVAL:-1.5}

# --- VALIDITY GATE --------------------------------------------------------------
# exit 0 от pi НЕ является успехом. invalid → packet возвращается, не мержится.
GATE_REQUIRE_STOP_OK=${GATE_REQUIRE_STOP_OK:-1}   # stop_reason_last == "error"
GATE_REQUIRE_TOOL_STEPS=${GATE_REQUIRE_TOOL_STEPS:-1}  # tool_steps == 0
GATE_REQUIRE_TURNS=${GATE_REQUIRE_TURNS:-1}       # turns < 2
POSTFLIGHT_FMT=${POSTFLIGHT_FMT:-1}      # cargo fmt --all в песочнице перед экспортом
POSTFLIGHT_CLIPPY=${POSTFLIGHT_CLIPPY:-1} # clippy -D warnings; ошибка = экспорт запрещён
# timeout == true && turns < 2 → invalid (умер до первого содержательного хода)

# --- SANDBOX --------------------------------------------------------------------
SANDBOX_ROOT=${SANDBOX_ROOT:-/tmp/stellwerk-sandbox}
SANDBOX_KEEP=${SANDBOX_KEEP:-0}          # 1 = не удалять песочницу после прогона
PATH_GUARD_STRICT=${PATH_GUARD_STRICT:-1} # 1 = абсолютный путь репо в packet запрещён (F1-вектор)
