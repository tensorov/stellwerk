[registry]
context_budget_tokens  = 44000
autoload_budget_tokens = 3000
lazy_budget_tokens     = 5000

# Коэффициенты байты->токены для qwen 35b a3b. Замерено один раз:
# пустая сессия без PolyForge vs с PolyForge (docs/CONTEXT_BUDGET.md, 8602 -> 9415),
# разница 813 токенов поделена на байты схем реального polyforge-mcp (4034 байта,
# `stellwark module measure polyforge`).
[registry.calibration]
tokens_per_byte = 0.2015369360   # 813 / 4034
measured_at     = "2026-09-26T21:47:46Z"

[module.polyforge]
kind     = "mcp"
autoload = true
risk     = "R3"
source   = { git = "https://github.com/tensorov/polyforge", rev = "b81f5848d5131d730f72d67e81db50f7377ab0c7" }
command  = "polyforge-mcp"
tools    = ["evidence_append", "evidence_verify", "gate_evaluate", "gate_report"]
context_cost_tokens = 0
# заполнит `stellwerk module measure`
update   = { channel = "tag", policy = "pr" }
